spring.application.name=Exp2_S4_Grupo3
server.port=8080

# =========================================================================
# LÍMITES Y PARÁMETROS OPERATIVOS BANCARIOS (CONFIGURACIÓN EXTERNA)
# Permite modificar políticas bancarias sin recompilar el código Java
# =========================================================================
# Límite máximo de giro en cajero automático (en pesos chilenos CLP)
banco.atm.limite-giro=200000

# Múltiplo de dispensación de billetes en cajero automático (denominación mínima)
banco.atm.multiplo-billete=5000

# Sobregiro por defecto para cuentas corrientes (en pesos chilenos CLP)
banco.cuenta.sobregiro-defecto=300000

# Límite de transacciones en resumen para canal móvil
banco.movil.limite-transacciones-resumen=3

# Swagger / OpenAPI config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
